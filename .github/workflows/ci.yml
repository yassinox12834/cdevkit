name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false            # one platform failing must not hide the others
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]  # oldest the launch scripts accept, and current
        include:
          # Ubuntu 22.04 ships GCC 11: covers the draft -std names and the
          # "standard accepted but library too old" cases.
          - os: ubuntu-22.04
            python: "3.10"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ---- Toolchain: the same one the installer sets up on each platform ------------

      - name: Toolchain (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false          # use the preinstalled C:\msys64, which devkit.system expects
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Put UCRT64 first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Toolchain (macOS, Homebrew GCC)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install gcc ninja    # CMake is already on the runner image

      - name: Toolchain (Linux, apt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # gcc/g++/cmake for the tests; the lib* packages let PySide6 import headless.
          sudo apt-get install -y --no-install-recommends gcc g++ cmake ninja-build \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # ---- Checks -------------------------------------------------------------------

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Syntax check (Python)
        run: python -m compileall -q devkit tests setup_app.py launcher_app.py

      - name: Syntax check (shell scripts)
        if: runner.os != 'Windows'
        run: bash -n _common.sh setup.sh launcher.sh setup.command launcher.command

      # Same step on both branches: main uses CustomTkinter, 1.0.0/pyside6 uses Qt.
      # Importing the two apps checks the GUI toolkit is installed and the code parses.
      - name: GUI modules import
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import setup_app, launcher_app; print('GUI modules import fine')"

      - name: C/C++ smoke test
        run: python tests/smoke.py

      - name: Unit tests
        run: python -m unittest discover tests -v
